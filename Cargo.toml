[package]
name = "simple-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "simple-api"
path = "main.rs"

[dependencies]
axum = "0.8"
csv = "1"
reqwest = { version = "0.12", features = ["gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
